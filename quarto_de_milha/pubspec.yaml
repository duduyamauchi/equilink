name: quarto_de_milha
description: "Quarto de Milha - identidade digital, genealogia, histórico esportivo e gestão de baias do cavalo Quarto de Milha."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  quarto_core:
    path: ../pacotes/quarto_core
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^18.1.0
  qr_flutter: ^4.1.0
  pdf: ^3.11.3
  printing: ^5.14.2
  barcode: ^2.2.9
  share_plus: ^11.1.0
  web: ^1.1.1
  video_player: ^2.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/img/
    - assets/video/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
